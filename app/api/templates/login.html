{% load static %}
<!DOCTYPE html>
<html lang="es-mx">
  <head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Diagnóstico de la Salud Social de los Planteles de Secundaria, Educación Media Superior y Educación Superior del Estado de Hidalgo">
    <meta name="keywords" content="Diagnóstico de la Salud Social de los Planteles de Secundaria, Educación Media Superior y Educación Superior del Estado de Hidalgo">
    <meta name="author" content="Instituto Hispanoamericano de Estudios Superiores S.C.">
    <link rel="icon" href="{% static '/assets/images/favicon.png' %}" type="image/x-icon">
    <link rel="shortcut icon" href="{% static '/assets/images/favicon.png'%}" type="image/x-icon">
    <title>DSSH - Diagnóstico de la Salud Social de los Planteles de Secundaria, Educación Media Superior y Educación Superior del Estado de Hidalgo</title>
    <!-- Google font-->
    <link rel="preconnect" href="https://fonts.gstatic.com">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap" rel="stylesheet">

    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,400;0,500;0,600;0,700;0,800;0,900;1,300;1,400;1,500;1,600;1,700;1,800;1,900&amp;display=swap" rel="stylesheet">
    <!-- Font Awesome-->
    <link rel="stylesheet" type="text/css" href="{% static '/assets/css/fontawesome.css'%}">
    <!-- ico-font-->
    <link rel="stylesheet" type="text/css" href="{% static '/assets/css/icofont.css'%}">
    <!-- Themify icon-->
    <link rel="stylesheet" type="text/css" href="{% static '/assets/css/themify.css'%}">
    <!-- Flag icon-->
    <link rel="stylesheet" type="text/css" href="{% static '/assets/css/flag-icon.css'%}">
    <!-- Feather icon-->
    <link rel="stylesheet" type="text/css" href="{% static '/assets/css/feather-icon.css'%}">
    <!-- Plugins css start-->
    <!-- Plugins css Ends-->
    <!-- Bootstrap css-->
    <link rel="stylesheet" type="text/css" href="{% static '/assets/css/bootstrap.css'%}">
    <!-- App css-->
    <link rel="stylesheet" type="text/css" href="{% static '/assets/css/style.css'%}">
    <link id="color" rel="stylesheet" href="{% static '/assets/css/color-1.css'%}" media="screen">
    <!-- Responsive css-->
    <link rel="stylesheet" type="text/css" href="{% static '/assets/css/responsive.css'%}">
    <style>
      .show-hide span.show::before {
        content: "mostrar" !important;
      }
    </style>
  </head>
  <body>
    <!-- Loader starts-->
    <div class="loader-wrapper">
      <div class="theme-loader">    
        <div class="loader-p"></div>
      </div>
    </div>
    <!-- Loader ends-->
    <!-- page-wrapper Start-->
    <section>         
      <div class="container-fluid p-0">
        <div class="row">
          <div class="col-xl-5">
            <img class="bg-img-cover bg-center" src="{% static '/assets/images/login/login2.png'%}" alt="looginpage">
          </div>
          <div class="col-xl-7 p-0">    
            <div class="login-card">
              <form name="loginForm" action="{% url 'login' %}" method="post" class="theme-form login-form">
                {% csrf_token %}
                <h4>Acceso - DSSH</h4>
                <h6>Bienvenido, inicia sesión con tu cuenta.</h6>
                <div class="form-group">
                  <label>CCT</label>
                  <div class="input-group"><span class="input-group-text"><i class="icon-user"></i></span>
                    <input class="form-control" name='username' type="text" required="" placeholder="13DML0002H">
                  </div>
                </div>
                <div class="form-group">
                  <label>Contraseña</label>
                  <div class="input-group"><span class="input-group-text"><i class="icon-lock"></i></span>
                    <input class="form-control" type="password" name="password" required="" placeholder="*********">
                    <div class="show-hide"><span class="show">                         </span></div>
                  </div>
                </div>
                <div class="form-group">
                  <button class="btn btn-primary btn-block" type="submit">Iniciar Sesión</button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </section>
    <!-- page-wrapper end-->
    <!-- latest jquery-->
    <script src="{% static '/assets/js/jquery-3.5.1.min.js'%}"></script>
    <!-- feather icon js-->
    <script src="{% static '/assets/js/icons/feather-icon/feather.min.js'%}"></script>
    <script src="{% static '/assets/js/icons/feather-icon/feather-icon.js'%}"></script>
    <!-- Sidebar jquery-->
    <script src="{% static '/assets/js/config.js'%}"></script>
    <!-- Bootstrap js-->
    <script src="{% static '/assets/js/bootstrap/popper.min.js'%}"></script>
    <script src="{% static '/assets/js/bootstrap/bootstrap.min.js'%}"></script>
    <!-- Plugins JS start-->
    <!-- Plugins JS Ends-->
    <!-- Theme js-->
    <script src="{% static '/assets/js/script.js'%}"></script>
    <!-- login js-->
    <!-- Plugin used-->
  </body>
