volumes:
  db_dssh:

networks:
  dssh_net:
  network:
    external: true

services:
  db_dssh:
    restart: always
    image: postgres:16
    volumes:
      - db_dssh:/var/lib/postgresql/data
    env_file:
      - ./.env/.prod
    networks:
      - dssh_net
    expose:
      - '5432'
  web:
    restart: always
    networks:
      - dssh_net
    build:
      context: ../.
      dockerfile: docker/Dockerfile_prod
    entrypoint: "bash /web/docker/entrypoint.sh"
    volumes:
      - ../.:/web
      - ../static/:/static
      - ../media/:/web/media/
    env_file:
      - ./.env/.prod
    expose:
      - 8000
    links:
      - redis
    depends_on:
      - db_dssh
  redis:
    restart: always
    image: redis:alpine
    networks:
      - dssh_net
  celery:
    restart: always
    networks:
      - dssh_net
    volumes:
      - ../.:/web
    build:
      context: ../.
      dockerfile: docker/Dockerfile_prod
    command: celery -A celery_app worker -l info
    links:
      - redis
    env_file:
      - ./.env/.prod
    depends_on:
      - web
  nginx:
    image: nginx:1.16
    restart: always
    environment:
      - VIRTUAL_HOST=${PUBLIC_DOMAIN:-dss.ihes.mx}
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=${PUBLIC_DOMAIN:-dss.ihes.mx}
    networks:
      - network
      - dssh_net
    
    expose:
      - 8080
      # - 443
    depends_on:
      - web
    links:
      - web
    volumes:
      - ../.:/web
      - ../static/:/static
      - ../media/:/web/media/
      - ./nginx.conf:/etc/nginx/nginx.conf
      # - ./data/certbot/conf:/etc/letsencrypt
      # - ./data/certbot/www:/var/www/certbot
